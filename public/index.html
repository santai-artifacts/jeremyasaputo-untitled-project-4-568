<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mad Libs</title>
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --muted: #8a8a8a;
    --line: #000;
    --faint: #e2e2e2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    font-size: 20px;
    line-height: 1.25;
    -webkit-font-smoothing: antialiased;
    padding: 60px 24px 120px;
  }
  .wrap { max-width: 700px; margin: 0 auto; }

  /* header */
  .masthead { margin-bottom: 54px; }
  .flower { font-size: 22px; display: block; margin-bottom: 18px; }
  h1 {
    font-size: 64px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
  }
  .lede { font-size: 20px; color: var(--ink); margin: 0; max-width: 30em; }

  /* step line */
  .stepline {
    display: flex;
    gap: 20px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 40px;
  }
  .stepline span { display: inline-flex; gap: 8px; }
  .stepline .dot.active { color: var(--ink); }
  .stepline .dot.done { color: var(--ink); }
  .stepline .dot.done::before { content: "✿ "; }

  /* type */
  label.field-label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  textarea, input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 26px;
    line-height: 1.25;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    padding: 8px 0;
    outline: none;
  }
  textarea {
    resize: none;
    min-height: 44px;
    overflow: hidden;
  }
  textarea::placeholder, input::placeholder { color: var(--faint); }
  input[type="text"]:focus, textarea:focus { border-bottom-color: var(--ink); }

  /* chips = plain inline suggestions */
  .chips {
    margin: 22px 0 0;
    font-size: 15px;
    color: var(--muted);
    line-height: 1.7;
  }
  .chips .lbl { text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; }
  .chip {
    font: inherit;
    font-size: 15px;
    background: none;
    border: none;
    padding: 0;
    color: var(--ink);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }
  .chip:hover { color: var(--muted); }
  .chip + .chip { margin-left: 2px; }
  .chip-sep { color: var(--faint); }

  /* buttons — bare bordered box, invert on hover */
  button.primary, button.ghost {
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 13px 26px;
    border: 1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    border-radius: 0;
    transition: background .15s, color .15s;
  }
  button.primary:hover, button.ghost:hover { background: var(--ink); color: var(--paper); }
  button.primary:disabled { opacity: .35; cursor: not-allowed; background: var(--paper); color: var(--ink); }

  .actions { margin-top: 40px; display: flex; gap: 14px; flex-wrap: wrap; }

  .hidden { display: none !important; }

  /* blanks */
  .blank-grid { display: grid; gap: 28px; }
  .blank { display: grid; gap: 8px; }
  .blank .hint {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .blank .hint .num { color: var(--faint); margin-right: 10px; }

  /* loading */
  .loader { padding: 10px 0; display: flex; align-items: baseline; gap: 12px; }
  .loader .spin { display: inline-block; animation: spin 1.4s linear infinite; }
  .loader p { margin: 0; font-size: 20px; color: var(--ink); }

  /* story */
  .story-title {
    font-size: 40px;
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 30px;
  }
  .story { font-size: 24px; line-height: 1.5; }
  .story p { margin: 0 0 1.1em; }
  .story .fill {
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }

  .error {
    margin-top: 18px;
    font-size: 15px;
    color: var(--ink);
    border-left: 2px solid var(--ink);
    padding-left: 12px;
  }

  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: var(--paper);
    padding: 10px 20px; font-size: 13px;
    letter-spacing: 0.04em; text-transform: uppercase;
    opacity: 0; pointer-events: none; transition: .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    margin-top: 80px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  @media (max-width: 560px) {
    body { padding: 40px 20px 90px; font-size: 18px; }
    h1 { font-size: 44px; }
    .story-title { font-size: 30px; }
    .story { font-size: 21px; }
    textarea, input[type="text"] { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <span class="flower">✿</span>
    <h1>Mad Libs</h1>
    <p class="lede">Name a theme. A story is written around it — then you fill in the blanks.</p>
  </div>

  <div class="stepline" id="steps">
    <span class="dot active" data-step="1">Theme</span>
    <span class="dot" data-step="2">Words</span>
    <span class="dot" data-step="3">Story</span>
  </div>

  <!-- STEP 1 -->
  <section id="step1">
    <label class="field-label" for="prompt">What should your story be about?</label>
    <textarea id="prompt" rows="1" placeholder="a cat who becomes a spaceship captain"></textarea>
    <div class="chips" id="chips"></div>
    <div class="actions">
      <button class="primary" id="genBtn">Write it</button>
    </div>
    <div id="err1"></div>
  </section>

  <!-- LOADING -->
  <section id="loading" class="hidden">
    <div class="loader">
      <span class="spin">✿</span>
      <p id="loadMsg">Writing your story…</p>
    </div>
  </section>

  <!-- STEP 2 -->
  <section id="step2" class="hidden">
    <label class="field-label">Fill in the blanks — no peeking at the story</label>
    <div class="blank-grid" id="blanks"></div>
    <div class="actions">
      <button class="primary" id="revealBtn">Reveal story</button>
      <button class="ghost" id="backBtn">New theme</button>
    </div>
    <div id="err2"></div>
  </section>

  <!-- STEP 3 -->
  <section id="step3" class="hidden">
    <h2 class="story-title" id="storyTitle"></h2>
    <div class="story" id="storyText"></div>
    <div class="actions">
      <button class="primary" id="copyBtn">Copy</button>
      <button class="ghost" id="editBtn">Edit words</button>
      <button class="ghost" id="againBtn">Start over</button>
    </div>
  </section>

  <footer>✿ Stories freshly written by AI</footer>
</div>

<div class="toast" id="toast"></div>

<script>
  const el = (id) => document.getElementById(id);
  const state = { data: null, values: [] };

  const SUGGESTIONS = [
    "a dragon who opens a bakery",
    "the worst day at a robot factory",
    "a detective solving a pizza heist",
    "my dog running for president",
    "an underwater rock concert",
  ];

  // suggestion links (bare, inline)
  const chips = el("chips");
  chips.innerHTML = '<span class="lbl">Try&nbsp;&nbsp;</span>';
  SUGGESTIONS.forEach((s, i) => {
    if (i > 0) { const sep = document.createElement("span"); sep.className = "chip-sep"; sep.textContent = " · "; chips.appendChild(sep); }
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = s;
    b.onclick = () => { el("prompt").value = s; autoGrow(el("prompt")); el("prompt").focus(); };
    chips.appendChild(b);
  });

  // auto-grow textarea
  function autoGrow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
  el("prompt").addEventListener("input", () => autoGrow(el("prompt")));

  function setStep(n) {
    ["step1","loading","step2","step3"].forEach((s) => el(s).classList.add("hidden"));
    document.querySelectorAll("#steps .dot").forEach((d) => {
      const step = +d.dataset.step;
      d.classList.toggle("active", step === Math.ceil(n));
      d.classList.toggle("done", step < n);
    });
    if (n === 1) el("step1").classList.remove("hidden");
    if (n === 1.5) el("loading").classList.remove("hidden");
    if (n === 2) el("step2").classList.remove("hidden");
    if (n === 3) el("step3").classList.remove("hidden");
  }

  function showError(where, msg) { el(where).innerHTML = '<div class="error">' + msg + '</div>'; }
  function clearError(where) { el(where).innerHTML = ""; }

  const loadMessages = [
    "Writing your story…",
    "Sharpening the pencils…",
    "Hiding the punchline…",
    "Counting the blanks…",
  ];
  let loadTimer = null;
  function cycleLoader() {
    let i = 0;
    el("loadMsg").textContent = loadMessages[0];
    loadTimer = setInterval(() => { i = (i + 1) % loadMessages.length; el("loadMsg").textContent = loadMessages[i]; }, 1600);
  }

  async function generate() {
    const prompt = el("prompt").value.trim();
    clearError("err1");
    if (!prompt) { showError("err1", "Give me a theme to work with."); return; }

    setStep(1.5);
    cycleLoader();
    el("genBtn").disabled = true;

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");

      state.data = data;
      state.values = data.blanks.map(() => "");
      renderBlanks();
      setStep(2);
    } catch (e) {
      setStep(1);
      showError("err1", e.message || "Couldn't reach the story machine. Try again.");
    } finally {
      clearInterval(loadTimer);
      el("genBtn").disabled = false;
    }
  }

  function renderBlanks() {
    const wrap = el("blanks");
    wrap.innerHTML = "";
    state.data.blanks.forEach((b, i) => {
      const div = document.createElement("div");
      div.className = "blank";
      div.innerHTML =
        '<label class="hint" for="b' + i + '"><span class="num">' + String(i+1).padStart(2,"0") + '</span>' +
        escapeHtml(b.label) + '</label>' +
        '<input type="text" id="b' + i + '" autocomplete="off" />';
      const input = div.querySelector("input");
      input.value = state.values[i] || "";
      input.addEventListener("input", () => { state.values[i] = input.value; });
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") {
          ev.preventDefault();
          const next = wrap.querySelector("#b" + (i+1));
          if (next) next.focus(); else revealStory();
        }
      });
      wrap.appendChild(div);
    });
    setTimeout(() => { const f = wrap.querySelector("input"); if (f) f.focus(); }, 60);
  }

  function revealStory() {
    clearError("err2");
    const missing = state.values.findIndex((v) => !v.trim());
    if (missing !== -1) {
      showError("err2", "Fill in every blank first — number " + String(missing+1).padStart(2,"0") + " is empty.");
      const inp = el("b" + missing);
      if (inp) inp.focus();
      return;
    }

    let html = escapeHtml(state.data.template);
    state.data.blanks.forEach((b, i) => {
      const token = "[[" + b.id + "]]";
      const val = '<span class="fill">' + escapeHtml(state.values[i].trim()) + "</span>";
      html = html.split(token).join(val);
    });
    html = html.replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>");

    el("storyTitle").textContent = state.data.title;
    el("storyText").innerHTML = "<p>" + html + "</p>";
    setStep(3);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function plainStory() {
    let text = state.data.template;
    state.data.blanks.forEach((b, i) => { text = text.split("[[" + b.id + "]]").join(state.values[i].trim()); });
    return state.data.title + "\n\n" + text;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function toast(msg) {
    const t = el("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try { await navigator.clipboard.writeText(text); return true; } catch {}
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch { return false; }
  }

  // wire up
  el("genBtn").onclick = generate;
  el("prompt").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generate(); }
  });
  el("revealBtn").onclick = revealStory;
  el("backBtn").onclick = () => setStep(1);
  el("editBtn").onclick = () => { renderBlanks(); setStep(2); };
  el("againBtn").onclick = () => { el("prompt").value = ""; autoGrow(el("prompt")); setStep(1); el("prompt").focus(); };
  el("copyBtn").onclick = async () => {
    const ok = await copyText(plainStory());
    toast(ok ? "Copied" : "Copy blocked — select the story to copy");
    if (!ok) {
      const range = document.createRange();
      range.selectNodeContents(el("storyText"));
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
    }
  };
</script>
</body>
</html>
