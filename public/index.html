<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mad Libs Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1: #ffe9f3;
    --bg2: #e7ecff;
    --ink: #241c33;
    --muted: #6b6480;
    --card: #ffffff;
    --accent: #ff5aa7;
    --accent2: #7c5cff;
    --accent3: #ffb340;
    --line: #efe9f7;
    --ok: #21c17a;
    --shadow: 0 20px 45px -18px rgba(88, 50, 140, 0.45);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 12% -10%, var(--bg1), transparent 55%),
      radial-gradient(1000px 620px at 110% 0%, var(--bg2), transparent 50%),
      linear-gradient(180deg, #fbf8ff, #f4f0ff);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 18px 64px;
  }

  header {
    text-align: center;
    margin: 8px 0 26px;
    max-width: 640px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent2);
    background: #fff;
    border: 1px solid var(--line);
    padding: 6px 14px;
    border-radius: 999px;
    box-shadow: 0 8px 22px -14px rgba(124, 92, 255, 0.6);
  }
  h1 {
    font-size: clamp(2.1rem, 6vw, 3.2rem);
    margin: 16px 0 6px;
    line-height: 1.02;
    background: linear-gradient(100deg, var(--accent), var(--accent2) 60%, var(--accent3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); font-size: 1.05rem; margin: 0; }

  .card {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px;
  }

  .steps {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 22px;
  }
  .dot {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.82rem; font-weight: 600; color: var(--muted);
  }
  .dot .n {
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center;
    background: #f1ecfb; color: var(--muted);
    font-size: 0.8rem; transition: .25s;
  }
  .dot.active .n { background: var(--accent2); color: #fff; }
  .dot.done .n { background: var(--ok); color: #fff; }
  .dot .bar { width: 22px; height: 2px; background: var(--line); border-radius: 2px; }

  label.field-label { display:block; font-weight: 600; margin-bottom: 8px; }
  textarea, input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 1.05rem;
    color: var(--ink);
    background: #fbfaff;
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    transition: border-color .18s, box-shadow .18s;
    outline: none;
  }
  textarea { resize: vertical; min-height: 96px; }
  textarea:focus, input[type="text"]:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.14);
  }

  .chips { display:flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
  .chip {
    font: inherit; font-size: 0.86rem;
    border: 1px dashed #d9cff2; background: #faf7ff; color: var(--accent2);
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
    transition: .15s;
  }
  .chip:hover { background: var(--accent2); color:#fff; border-color: var(--accent2); transform: translateY(-1px); }

  button.primary {
    margin-top: 20px;
    width: 100%;
    font: inherit; font-weight: 600; font-size: 1.08rem;
    color: #fff;
    background: linear-gradient(100deg, var(--accent), var(--accent2));
    border: none; border-radius: 14px; padding: 15px;
    cursor: pointer;
    box-shadow: 0 14px 26px -12px rgba(124, 92, 255, 0.75);
    transition: transform .12s, filter .2s;
  }
  button.primary:hover { transform: translateY(-2px); filter: brightness(1.04); }
  button.primary:active { transform: translateY(0); }
  button.primary:disabled { opacity: .6; cursor: not-allowed; transform:none; filter:none; }

  button.ghost {
    font: inherit; font-weight: 600; color: var(--accent2);
    background: transparent; border: 2px solid var(--line);
    border-radius: 14px; padding: 13px 18px; cursor: pointer;
    transition: .15s;
  }
  button.ghost:hover { border-color: var(--accent2); }

  .row { display:flex; gap: 12px; margin-top: 18px; }
  .row button { flex: 1; margin-top: 0; }

  .blank-grid { display: grid; gap: 14px; }
  .blank {
    display: grid; gap: 6px;
    animation: pop .32s ease both;
  }
  .blank .hint {
    font-size: 0.82rem; font-weight: 600; color: var(--accent2);
    text-transform: capitalize; letter-spacing: .01em;
  }
  .blank .hint span.num {
    display:inline-grid; place-items:center; width:20px; height:20px;
    background:#f1ecfb; color:var(--muted); border-radius:50%;
    font-size:0.72rem; margin-right:7px;
  }

  .hidden { display: none !important; }

  /* story reveal */
  .story-title {
    font-family: "Kalam", cursive;
    font-size: 1.9rem; font-weight: 700;
    margin: 0 0 14px; text-align: center;
    color: var(--accent2);
  }
  .story {
    font-family: "Kalam", cursive;
    font-size: 1.28rem; line-height: 1.9;
    color: var(--ink);
    background:
      linear-gradient(#fff, #fff) padding-box,
      repeating-linear-gradient(#fff 0 31px, #e9e2fb 31px 32px) padding-box;
    background: #fffef9;
    padding: 22px 22px;
    border-radius: 16px;
    border: 1px solid var(--line);
  }
  .story .fill {
    color: var(--accent);
    font-weight: 700;
    border-bottom: 2px solid rgba(255,90,167,.35);
    padding: 0 2px;
    animation: hi .5s ease both;
  }

  .loader { display:flex; flex-direction:column; align-items:center; gap:14px; padding: 22px 0; }
  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 5px solid #eee3ff; border-top-color: var(--accent2);
    animation: spin .8s linear infinite;
  }
  .loader p { color: var(--muted); margin: 0; font-weight: 500; }

  .error {
    margin-top: 14px; padding: 12px 14px;
    background: #fff1f4; border: 1px solid #ffd0dd; color: #c13a63;
    border-radius: 12px; font-weight: 500; font-size: 0.95rem;
  }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px;
    font-weight: 600; font-size: 0.92rem; opacity: 0; pointer-events: none;
    transition: .3s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { color: var(--muted); font-size: 0.85rem; margin-top: 26px; text-align:center; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes hi { from { background: #fff3ba; } to { background: transparent; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 480px) {
    .card { padding: 20px; }
    .dot span.txt { display:none; }
  }
</style>
</head>
<body>
  <header>
    <span class="badge">✨ AI-powered</span>
    <h1>Mad Libs Machine</h1>
    <p>Name a theme. We write a silly story around it — you fill in the blanks.</p>
  </header>

  <div class="card">
    <div class="steps" id="steps">
      <div class="dot active" data-step="1"><span class="n">1</span><span class="txt">Theme</span></div>
      <div class="bar"></div>
      <div class="dot" data-step="2"><span class="n">2</span><span class="txt">Words</span></div>
      <div class="bar"></div>
      <div class="dot" data-step="3"><span class="n">3</span><span class="txt">Story</span></div>
    </div>

    <!-- STEP 1 -->
    <section id="step1">
      <label class="field-label" for="prompt">What should your story be about?</label>
      <textarea id="prompt" placeholder="e.g. a cat who becomes a spaceship captain"></textarea>
      <div class="chips" id="chips"></div>
      <button class="primary" id="genBtn">Write my Mad Lib →</button>
      <div id="err1"></div>
    </section>

    <!-- LOADING -->
    <section id="loading" class="hidden">
      <div class="loader">
        <div class="spinner"></div>
        <p id="loadMsg">Dreaming up your story…</p>
      </div>
    </section>

    <!-- STEP 2 -->
    <section id="step2" class="hidden">
      <label class="field-label">Fill in the blanks — no peeking at the story!</label>
      <div class="blank-grid" id="blanks"></div>
      <div class="row">
        <button class="ghost" id="backBtn">← New theme</button>
        <button class="primary" id="revealBtn">Reveal story 🎉</button>
      </div>
      <div id="err2"></div>
    </section>

    <!-- STEP 3 -->
    <section id="step3" class="hidden">
      <h2 class="story-title" id="storyTitle"></h2>
      <div class="story" id="storyText"></div>
      <div class="row">
        <button class="ghost" id="editBtn">← Edit words</button>
        <button class="primary" id="copyBtn">Copy story</button>
      </div>
      <div class="row">
        <button class="ghost" id="againBtn" style="flex:1">Start over</button>
      </div>
    </section>
  </div>

  <footer>Stories are freshly written by AI for each theme.</footer>
  <div class="toast" id="toast"></div>

<script>
  const el = (id) => document.getElementById(id);
  const state = { data: null, values: [] };

  const SUGGESTIONS = [
    "a dragon who opens a bakery",
    "the worst day at a robot factory",
    "a detective solving a pizza heist",
    "my dog running for president",
    "an underwater rock concert",
    "a wizard's first day at high school",
  ];

  // seed suggestion chips
  const chips = el("chips");
  SUGGESTIONS.forEach((s) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = s;
    b.onclick = () => { el("prompt").value = s; el("prompt").focus(); };
    chips.appendChild(b);
  });

  function setStep(n) {
    ["step1","loading","step2","step3"].forEach((s) => el(s).classList.add("hidden"));
    document.querySelectorAll("#steps .dot").forEach((d) => {
      const step = +d.dataset.step;
      d.classList.toggle("active", step === n);
      d.classList.toggle("done", step < n);
    });
    if (n === 1) el("step1").classList.remove("hidden");
    if (n === 1.5) { el("loading").classList.remove("hidden"); document.querySelector('.dot[data-step="1"]').classList.add("done"); document.querySelector('.dot[data-step="1"]').classList.remove("active"); }
    if (n === 2) el("step2").classList.remove("hidden");
    if (n === 3) el("step3").classList.remove("hidden");
  }

  function showError(where, msg) {
    el(where).innerHTML = '<div class="error">' + msg + '</div>';
  }
  function clearError(where) { el(where).innerHTML = ""; }

  const loadMessages = [
    "Dreaming up your story…",
    "Sharpening the pencils…",
    "Hiding the punchline…",
    "Counting the blanks…",
  ];
  let loadTimer = null;
  function cycleLoader() {
    let i = 0;
    el("loadMsg").textContent = loadMessages[0];
    loadTimer = setInterval(() => {
      i = (i + 1) % loadMessages.length;
      el("loadMsg").textContent = loadMessages[i];
    }, 1600);
  }

  async function generate() {
    const prompt = el("prompt").value.trim();
    clearError("err1");
    if (!prompt) { showError("err1", "Give me a theme to work with 🙂"); return; }

    setStep(1.5);
    cycleLoader();
    el("genBtn").disabled = true;

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");

      state.data = data;
      state.values = data.blanks.map(() => "");
      renderBlanks();
      setStep(2);
    } catch (e) {
      setStep(1);
      showError("err1", e.message || "Couldn't reach the story machine. Try again.");
    } finally {
      clearInterval(loadTimer);
      el("genBtn").disabled = false;
    }
  }

  function renderBlanks() {
    const wrap = el("blanks");
    wrap.innerHTML = "";
    state.data.blanks.forEach((b, i) => {
      const div = document.createElement("div");
      div.className = "blank";
      div.style.animationDelay = (i * 0.04) + "s";
      div.innerHTML =
        '<label class="hint" for="b' + i + '"><span class="num">' + (i+1) + '</span>' +
        escapeHtml(b.label) + '</label>' +
        '<input type="text" id="b' + i + '" autocomplete="off" placeholder="' +
        escapeHtml(b.label) + '" />';
      const input = div.querySelector("input");
      input.value = state.values[i] || "";
      input.addEventListener("input", () => { state.values[i] = input.value; });
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") {
          ev.preventDefault();
          const next = wrap.querySelector("#b" + (i+1));
          if (next) next.focus(); else revealStory();
        }
      });
      wrap.appendChild(div);
    });
    setTimeout(() => { const f = wrap.querySelector("input"); if (f) f.focus(); }, 60);
  }

  function revealStory() {
    clearError("err2");
    const missing = state.values.findIndex((v) => !v.trim());
    if (missing !== -1) {
      showError("err2", "Fill in every blank first — #" + (missing+1) + " is empty.");
      const inp = el("b" + missing);
      if (inp) inp.focus();
      return;
    }

    let html = escapeHtml(state.data.template);
    state.data.blanks.forEach((b, i) => {
      const token = "[[" + b.id + "]]";
      const val = '<span class="fill">' + escapeHtml(state.values[i].trim()) + "</span>";
      html = html.split(token).join(val);
    });
    // paragraph breaks
    html = html.replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>");

    el("storyTitle").textContent = state.data.title;
    el("storyText").innerHTML = "<p>" + html + "</p>";
    setStep(3);
  }

  function plainStory() {
    let text = state.data.template;
    state.data.blanks.forEach((b, i) => {
      text = text.split("[[" + b.id + "]]").join(state.values[i].trim());
    });
    return state.data.title + "\n\n" + text;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function toast(msg) {
    const t = el("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  // wire up
  el("genBtn").onclick = generate;
  el("prompt").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) generate();
  });
  el("revealBtn").onclick = revealStory;
  el("backBtn").onclick = () => setStep(1);
  el("editBtn").onclick = () => { renderBlanks(); setStep(2); };
  el("againBtn").onclick = () => { el("prompt").value = ""; setStep(1); el("prompt").focus(); };
  el("copyBtn").onclick = async () => {
    try {
      await navigator.clipboard.writeText(plainStory());
      toast("Story copied! 📋");
    } catch {
      toast("Couldn't copy — select and copy manually.");
    }
  };
</script>
</body>
</html>
