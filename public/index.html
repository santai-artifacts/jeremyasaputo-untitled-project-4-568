<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mad Libs</title>
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --muted: #8a8a8a;
    --line: #000;
    --faint: #e2e2e2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    font-size: 20px;
    line-height: 1.25;
    -webkit-font-smoothing: antialiased;
    padding: 34px 24px 120px;
  }
  .wrap { max-width: 700px; margin: 0 auto; }

  /* top nav */
  nav.top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--ink);
    margin-bottom: 54px;
  }
  nav.top .brand {
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 700;
  }
  nav.top .links { display: flex; gap: 22px; }
  nav.top .navlink {
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    background: none; border: none; padding: 0; cursor: pointer;
  }
  nav.top .navlink.active {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 6px;
    text-decoration-thickness: 1px;
  }

  /* header */
  .masthead { margin-bottom: 48px; }
  h1 {
    font-size: 64px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
  }
  .lede { font-size: 20px; margin: 0; max-width: 30em; }

  /* step line */
  .stepline {
    display: flex; gap: 20px;
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 40px;
  }
  .stepline .dot.active, .stepline .dot.done { color: var(--ink); }
  .stepline .dot.done::before { content: "✿ "; }

  label.field-label {
    display: block; font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
  }

  textarea, input[type="text"] {
    width: 100%;
    font-family: inherit; font-size: 26px; line-height: 1.25;
    color: var(--ink); background: transparent;
    border: none; border-bottom: 1px solid var(--line); border-radius: 0;
    padding: 8px 0; outline: none;
  }
  textarea { resize: none; min-height: 44px; overflow: hidden; }
  textarea::placeholder, input::placeholder { color: var(--faint); }
  input[type="text"]:focus, textarea:focus { border-bottom-color: var(--ink); }

  .chips { margin: 22px 0 0; font-size: 15px; color: var(--muted); line-height: 1.7; }
  .chips .lbl { text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; }
  .chip {
    font: inherit; font-size: 15px; background: none; border: none; padding: 0;
    color: var(--ink); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px;
  }
  .chip:hover { color: var(--muted); }
  .chip-sep { color: var(--faint); }
  .refresh, .wordbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0;
    background: none; border: none; border-radius: 50%;
    color: var(--muted); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .refresh { width: 26px; height: 26px; margin-left: 6px; vertical-align: middle; }
  .refresh:hover, .wordbtn:hover { background: #f1f1f1; color: var(--ink); }
  .refresh:active, .wordbtn:active { background: #e6e6e6; }
  .refresh svg, .wordbtn svg { display: block; }
  .refresh.spin-once svg { animation: spin .5s linear; }
  .wordbtn.spinning { color: var(--ink); }
  .flowerspin {
    display: inline-block; font-size: 16px; line-height: 1;
    animation: spin 1s linear infinite;
  }

  /* input + per-word suggest button */
  .inputrow { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); }
  .inputrow input[type="text"] { border-bottom: none; flex: 1; }
  .inputrow:focus-within { border-bottom-color: var(--ink); }

  button.primary, button.ghost {
    font-family: inherit; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 13px 26px; border: 1px solid var(--ink);
    background: var(--paper); color: var(--ink); cursor: pointer; border-radius: 0;
    transition: background .15s, color .15s;
  }
  button.primary:hover, button.ghost:hover { background: var(--ink); color: var(--paper); }
  button.primary:disabled { opacity: .35; cursor: not-allowed; background: var(--paper); color: var(--ink); }

  .actions { margin-top: 40px; display: flex; gap: 14px; flex-wrap: wrap; }
  .hidden { display: none !important; }

  .lucky-bar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding-bottom: 30px; margin-bottom: 30px; border-bottom: 1px solid var(--faint);
  }
  .lucky-note { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

  /* blanks */
  .blank-grid { display: grid; gap: 28px; }
  .blank { display: grid; gap: 8px; }
  .blank .hint { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .blank .hint .num { color: var(--faint); margin-right: 10px; }

  /* loading */
  .loader { padding: 10px 0; display: flex; align-items: baseline; gap: 12px; }
  .loader .spin { display: inline-block; animation: spin 1.4s linear infinite; }
  .loader p { margin: 0; font-size: 20px; }

  /* story */
  .story-title { font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 30px; }
  .story { font-size: 24px; line-height: 1.5; }
  .story p { margin: 0 0 1.1em; }
  .story p:last-child { margin-bottom: 0; }
  .story .fill { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

  .error { margin-top: 18px; font-size: 15px; border-left: 2px solid var(--ink); padding-left: 12px; }

  /* gallery */
  .gallery-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 40px; }
  .gallery-head h2 { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .gallery-head .count { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .empty { color: var(--muted); font-size: 20px; padding: 20px 0; }
  .entry { padding: 34px 0; border-top: 1px solid var(--faint); }
  .entry:first-child { border-top: none; padding-top: 0; }
  .entry-meta { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .entry-title { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 16px; }
  .entry .story { font-size: 19px; line-height: 1.5; }
  .entry-actions { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .linkbtn {
    font: inherit; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    background: none; border: none; padding: 0; color: var(--ink); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px;
  }
  .linkbtn:hover { color: var(--muted); }
  .entry-actions .sep { color: var(--faint); margin: 0 8px; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: var(--paper); padding: 10px 20px; font-size: 13px;
    letter-spacing: 0.04em; text-transform: uppercase; opacity: 0; pointer-events: none; transition: .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { margin-top: 80px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  @media (max-width: 560px) {
    body { padding: 24px 20px 90px; font-size: 18px; }
    h1 { font-size: 44px; }
    .story-title, .gallery-head h2 { font-size: 30px; }
    .story { font-size: 21px; }
    textarea, input[type="text"] { font-size: 22px; }
    nav.top { margin-bottom: 40px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top">
    <span class="brand">✿ Mad Libs</span>
    <div class="links">
      <button class="navlink active" id="navWrite">Write</button>
      <button class="navlink" id="navGallery">Gallery</button>
    </div>
  </nav>

  <!-- ============ WRITE VIEW ============ -->
  <div id="view-write">
    <div class="masthead">
      <h1>Mad Libs</h1>
      <p class="lede">Name a theme. A story is written around it — then you fill in the blanks.</p>
    </div>

    <div class="stepline" id="steps">
      <span class="dot active" data-step="1">Theme</span>
      <span class="dot" data-step="2">Words</span>
      <span class="dot" data-step="3">Story</span>
    </div>

    <!-- STEP 1 -->
    <section id="step1">
      <label class="field-label" for="prompt">What should your story be about?</label>
      <textarea id="prompt" rows="1" placeholder="a cat who becomes a spaceship captain"></textarea>
      <div class="chips" id="chips"></div>
      <div class="actions"><button class="primary" id="genBtn">Write it</button></div>
      <div id="err1"></div>
    </section>

    <!-- LOADING -->
    <section id="loading" class="hidden">
      <div class="loader"><span class="spin">✿</span><p id="loadMsg">Writing your story…</p></div>
    </section>

    <!-- STEP 2 -->
    <section id="step2" class="hidden">
      <div class="lucky-bar">
        <button class="primary" id="luckyBtn">✿ I'm feeling lucky</button>
        <span class="lucky-note">fill every blank at once</span>
      </div>
      <label class="field-label">Or fill in the blanks yourself — no peeking at the story</label>
      <div class="blank-grid" id="blanks"></div>
      <div class="actions">
        <button class="primary" id="revealBtn">Reveal story</button>
        <button class="ghost" id="backBtn">New theme</button>
      </div>
      <div id="err2"></div>
    </section>

    <!-- STEP 3 -->
    <section id="step3" class="hidden">
      <h2 class="story-title" id="storyTitle"></h2>
      <div class="story" id="storyText"></div>
      <div class="actions">
        <button class="primary" id="saveBtn">Save to gallery</button>
        <button class="ghost" id="copyBtn">Copy</button>
        <button class="ghost" id="editBtn">Edit words</button>
        <button class="ghost" id="againBtn">Start over</button>
      </div>
    </section>
  </div>

  <!-- ============ GALLERY VIEW ============ -->
  <div id="view-gallery" class="hidden">
    <div class="gallery-head">
      <h2>Saved Stories</h2>
      <span class="count" id="galleryCount"></span>
    </div>
    <div id="galleryList"></div>
  </div>

  <footer>✿ Stories freshly written by AI</footer>
</div>

<div class="toast" id="toast"></div>

<script>
  const el = (id) => document.getElementById(id);
  const state = { data: null, values: [], prompt: "", savedId: null };

  const REFRESH_SVG =
    '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>';

  const SUGGESTIONS = [
    "a dragon who opens a bakery",
    "the worst day at a robot factory",
    "a detective solving a pizza heist",
    "my dog running for president",
    "an underwater rock concert",
    "a wizard's first day at high school",
    "a grandma who races monster trucks",
    "aliens reviewing Earth's snacks",
    "a haunted vending machine",
    "the cat mayor of a small town",
    "two rival ice cream trucks",
    "a knight afraid of horses",
    "a pigeon planning a bank heist",
    "the last slice of pizza on Earth",
    "a yoga class for dinosaurs",
    "a superhero whose power is naps",
    "a talking GPS that gives up",
    "a spelling bee gone terribly wrong",
    "a spa retreat for tired robots",
    "the ghost who haunts a laundromat",
    "a food truck on the moon",
    "a librarian with a secret double life",
    "a penguin who hates the cold",
    "the world's clumsiest ninja",
  ];

  /* ---------- suggestions ---------- */
  const chips = el("chips");
  let chipStart = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  let chipPool = shuffle(SUGGESTIONS);

  function renderChips() {
    chips.innerHTML = '<span class="lbl">Try&nbsp;&nbsp;</span>';
    const picks = [];
    for (let k = 0; k < 5; k++) picks.push(chipPool[(chipStart + k) % chipPool.length]);
    picks.forEach((s, i) => {
      if (i > 0) { const sep = document.createElement("span"); sep.className = "chip-sep"; sep.textContent = " · "; chips.appendChild(sep); }
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = s;
      b.onclick = () => { el("prompt").value = s; autoGrow(el("prompt")); el("prompt").focus(); };
      chips.appendChild(b);
    });
    const ref = document.createElement("button");
    ref.className = "refresh"; ref.type = "button"; ref.innerHTML = REFRESH_SVG;
    ref.title = "More ideas"; ref.setAttribute("aria-label", "More ideas");
    ref.onclick = () => {
      chipStart += 5;
      if (chipStart >= chipPool.length) { chipPool = shuffle(SUGGESTIONS); chipStart = 0; }
      ref.classList.add("spin-once");
      setTimeout(() => ref.classList.remove("spin-once"), 400);
      renderChips();
    };
    chips.appendChild(ref);
  }
  renderChips();

  function autoGrow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
  el("prompt").addEventListener("input", () => autoGrow(el("prompt")));

  /* ---------- view switching ---------- */
  function showView(which) {
    const write = which === "write";
    el("view-write").classList.toggle("hidden", !write);
    el("view-gallery").classList.toggle("hidden", write);
    el("navWrite").classList.toggle("active", write);
    el("navGallery").classList.toggle("active", !write);
    if (!write) loadGallery();
    window.scrollTo({ top: 0 });
  }
  el("navWrite").onclick = () => showView("write");
  el("navGallery").onclick = () => showView("gallery");

  /* ---------- step flow ---------- */
  function setStep(n) {
    ["step1","loading","step2","step3"].forEach((s) => el(s).classList.add("hidden"));
    document.querySelectorAll("#steps .dot").forEach((d) => {
      const step = +d.dataset.step;
      d.classList.toggle("active", step === Math.ceil(n));
      d.classList.toggle("done", step < n);
    });
    if (n === 1) el("step1").classList.remove("hidden");
    if (n === 1.5) el("loading").classList.remove("hidden");
    if (n === 2) el("step2").classList.remove("hidden");
    if (n === 3) el("step3").classList.remove("hidden");
  }

  function showError(where, msg) { el(where).innerHTML = '<div class="error">' + msg + '</div>'; }
  function clearError(where) { el(where).innerHTML = ""; }

  const loadMessages = ["Writing your story…","Sharpening the pencils…","Hiding the punchline…","Counting the blanks…"];
  let loadTimer = null;
  function cycleLoader() {
    let i = 0; el("loadMsg").textContent = loadMessages[0];
    loadTimer = setInterval(() => { i = (i + 1) % loadMessages.length; el("loadMsg").textContent = loadMessages[i]; }, 1600);
  }

  async function generate() {
    const prompt = el("prompt").value.trim();
    clearError("err1");
    if (!prompt) { showError("err1", "Give me a theme to work with."); return; }
    setStep(1.5); cycleLoader(); el("genBtn").disabled = true;
    try {
      const res = await fetch("/api/generate", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      state.data = data; state.values = data.blanks.map(() => ""); state.prompt = prompt; state.savedId = null;
      renderBlanks();
      setStep(2);
    } catch (e) {
      setStep(1);
      showError("err1", e.message || "Couldn't reach the story machine. Try again.");
    } finally {
      clearInterval(loadTimer); el("genBtn").disabled = false;
    }
  }

  function renderBlanks() {
    const wrap = el("blanks");
    wrap.innerHTML = "";
    state.data.blanks.forEach((b, i) => {
      const div = document.createElement("div");
      div.className = "blank";
      div.innerHTML =
        '<label class="hint" for="b' + i + '"><span class="num">' + String(i+1).padStart(2,"0") + '</span>' +
        escapeHtml(b.label) + '</label>' +
        '<div class="inputrow">' +
          '<input type="text" id="b' + i + '" autocomplete="off" />' +
          '<button class="wordbtn" type="button" title="Think of a word for me" aria-label="Think of a word for me">' + REFRESH_SVG + '</button>' +
        '</div>';
      const input = div.querySelector("input");
      input.value = state.values[i] || "";
      input.addEventListener("input", () => { state.values[i] = input.value; state.savedId = null; });
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") {
          ev.preventDefault();
          const next = wrap.querySelector("#b" + (i+1));
          if (next) next.focus(); else revealStory();
        }
      });
      const wbtn = div.querySelector(".wordbtn");
      wbtn.onclick = () => suggestWord(b.label, input, wbtn, i);
      wrap.appendChild(div);
    });
    setTimeout(() => { const f = wrap.querySelector("input"); if (f) f.focus(); }, 60);
  }

  async function suggestWord(label, input, btn, i) {
    if (btn.classList.contains("spinning")) return;
    btn.classList.add("spinning");
    btn.innerHTML = '<span class="flowerspin">✿</span>'; // spinning flower while it thinks

    // Words already in the story (other blanks) — never suggest a duplicate.
    const usedElsewhere = new Set(
      state.values
        .map((v, idx) => (idx !== i && v ? v.trim().toLowerCase() : ""))
        .filter(Boolean)
    );
    const avoid = [...usedElsewhere];

    try {
      let chosen = null, lastWord = null;
      for (let attempt = 0; attempt < 4 && !chosen; attempt++) {
        const res = await fetch("/api/word", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            label, theme: state.prompt, avoid,
            template: state.data.template, id: state.data.blanks[i].id,
          }),
        });
        const out = await res.json();
        if (!res.ok || !out.word) throw new Error(out.error || "no word");
        lastWord = out.word;
        if (!usedElsewhere.has(out.word.trim().toLowerCase())) chosen = out.word;
        else if (!avoid.includes(out.word)) avoid.push(out.word); // steer away and retry
      }
      const word = chosen || lastWord;
      input.value = word;
      state.values[i] = word;
      state.savedId = null;
    } catch {
      toast("Couldn't think of one");
    } finally {
      btn.classList.remove("spinning");
      btn.innerHTML = REFRESH_SVG;
    }
  }

  async function fillLucky() {
    if (!state.data) return;
    const btn = el("luckyBtn");
    const orig = btn.textContent;
    btn.disabled = true; el("revealBtn").disabled = true;
    btn.textContent = "Thinking…";
    clearError("err2");
    try {
      const res = await fetch("/api/fill", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ theme: state.prompt, blanks: state.data.blanks, template: state.data.template }),
      });
      const out = await res.json();
      if (!res.ok || !Array.isArray(out.words)) throw new Error(out.error || "Couldn't fill them in");
      const byId = {};
      out.words.forEach((w) => { byId[w.id] = w.word; });
      state.data.blanks.forEach((b, i) => {
        const w = byId[b.id];
        if (w != null) { state.values[i] = w; const inp = el("b" + i); if (inp) inp.value = w; }
      });
      state.savedId = null;
      revealStory();
    } catch (e) {
      showError("err2", (e && e.message) || "Couldn't fill them in. Try again.");
    } finally {
      btn.disabled = false; el("revealBtn").disabled = false; btn.textContent = orig;
    }
  }

  /* ---------- the smart assembler ----------
     Walks the template, dropping filled words in with:
       • capitalization when the blank starts a sentence
       • punctuation de-duplication (wowza! + "!" => Wowza!)
     Used for the reveal, the copy text, and every gallery entry. */
  const OPEN_QUOTES = ['"', "'", "“", "‘", "(", "["];
  const TERMINALS = new Set([".", "!", "?", ",", ";", ":"]);

  function assemble(data, values) {
    const byId = {};
    data.blanks.forEach((b, i) => { byId[b.id] = (values[i] != null ? String(values[i]) : "").trim(); });

    // tokenize into ordered literal/token nodes
    const seq = [];
    const re = /\[\[(\d+)\]\]/g;
    let last = 0, m;
    while ((m = re.exec(data.template)) !== null) {
      if (m.index > last) seq.push({ t: "lit", s: data.template.slice(last, m.index) });
      seq.push({ t: "tok", id: Number(m[1]) });
      last = m.index + m[0].length;
    }
    if (last < data.template.length) seq.push({ t: "lit", s: data.template.slice(last) });

    const parts = [];
    let emitted = "";
    for (let i = 0; i < seq.length; i++) {
      const node = seq[i];
      if (node.t === "lit") { parts.push({ text: node.s, fill: false }); emitted += node.s; continue; }

      let val = byId[node.id] || "";

      // capitalization: sentence start?
      let e = emitted.replace(/\s+$/, "");
      const newlineBefore = /\n\s*$/.test(emitted);
      if (e && OPEN_QUOTES.includes(e[e.length - 1])) e = e.slice(0, -1);
      const lastChar = e.slice(-1);
      const sentenceStart = e === "" || newlineBefore || lastChar === "." || lastChar === "!" || lastChar === "?";
      if (sentenceStart && val) {
        const idx = val.search(/[A-Za-z]/);
        if (idx !== -1) val = val.slice(0, idx) + val[idx].toUpperCase() + val.slice(idx + 1);
      }

      // punctuation dedup: if the word already ends a sentence, drop the template's next mark
      if (TERMINALS.has(val.slice(-1))) {
        const next = seq[i + 1];
        if (next && next.t === "lit" && next.s.length && TERMINALS.has(next.s[0])) {
          next.s = next.s.slice(1);
        }
      }

      parts.push({ text: val, fill: true });
      emitted += val;
    }
    return { parts, plain: parts.map((p) => p.text).join("") };
  }

  function storyHTML(data, values) {
    const { parts } = assemble(data, values);
    let html = "";
    for (const p of parts) {
      if (p.fill) html += '<span class="fill">' + escapeHtml(p.text) + "</span>";
      else html += escapeHtml(p.text).replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>");
    }
    return "<p>" + html + "</p>";
  }

  function revealStory() {
    clearError("err2");
    const missing = state.values.findIndex((v) => !v.trim());
    if (missing !== -1) {
      showError("err2", "Fill in every blank first — number " + String(missing+1).padStart(2,"0") + " is empty.");
      const inp = el("b" + missing); if (inp) inp.focus();
      return;
    }
    el("storyTitle").textContent = state.data.title;
    el("storyText").innerHTML = storyHTML(state.data, state.values);
    el("saveBtn").disabled = false;
    el("saveBtn").textContent = "Save to gallery";
    setStep(3);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function toast(msg) {
    const t = el("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try { await navigator.clipboard.writeText(text); return true; } catch {}
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
    } catch { return false; }
  }

  /* ---------- save + gallery ---------- */
  async function saveStory() {
    if (!state.data) return;
    if (state.savedId) { toast("Already saved"); return; }
    el("saveBtn").disabled = true;
    try {
      const res = await fetch("/api/stories", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: state.data.title, prompt: state.prompt,
          template: state.data.template, blanks: state.data.blanks, values: state.values,
        }),
      });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error || "Couldn't save.");
      state.savedId = out.id;
      el("saveBtn").textContent = "Saved ✿";
      toast("Saved to gallery");
    } catch (e) {
      el("saveBtn").disabled = false;
      toast(e.message || "Couldn't save");
    }
  }

  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
    catch { return ""; }
  }

  async function loadGallery() {
    const listEl = el("galleryList");
    listEl.innerHTML = '<div class="empty">Loading…</div>';
    try {
      const res = await fetch("/api/stories");
      const { stories } = await res.json();
      el("galleryCount").textContent = stories.length ? stories.length + (stories.length === 1 ? " story" : " stories") : "";
      if (!stories.length) {
        listEl.innerHTML = '<div class="empty">No saved stories yet. Write one, then hit “Save to gallery.”</div>';
        return;
      }
      listEl.innerHTML = "";
      stories.forEach((s) => {
        const art = document.createElement("article");
        art.className = "entry";
        const meta = s.prompt ? (s.prompt + " — " + fmtDate(s.created_at)) : fmtDate(s.created_at);
        art.innerHTML =
          '<div class="entry-meta">' + escapeHtml(meta) + '</div>' +
          '<h3 class="entry-title">' + escapeHtml(s.title) + '</h3>' +
          '<div class="story">' + storyHTML(s, s.values) + '</div>' +
          '<div class="entry-actions">' +
            '<button class="linkbtn" data-act="copy">Copy</button>' +
            '<span class="sep">·</span>' +
            '<button class="linkbtn" data-act="remove">Remove</button>' +
          '</div>';
        art.querySelector('[data-act="copy"]').onclick = async () => {
          const ok = await copyText(assemble(s, s.values).plain
            ? s.title + "\n\n" + assemble(s, s.values).plain : s.title);
          toast(ok ? "Copied" : "Copy blocked");
        };
        art.querySelector('[data-act="remove"]').onclick = async () => {
          await fetch("/api/stories/" + s.id, { method: "DELETE" });
          loadGallery();
        };
        listEl.appendChild(art);
      });
    } catch {
      listEl.innerHTML = '<div class="empty">Couldn’t load the gallery.</div>';
    }
  }

  /* ---------- wire up ---------- */
  el("genBtn").onclick = generate;
  el("prompt").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generate(); }
  });
  el("revealBtn").onclick = revealStory;
  el("luckyBtn").onclick = fillLucky;
  el("backBtn").onclick = () => setStep(1);
  el("editBtn").onclick = () => { renderBlanks(); setStep(2); };
  el("againBtn").onclick = () => { el("prompt").value = ""; autoGrow(el("prompt")); setStep(1); el("prompt").focus(); };
  el("saveBtn").onclick = saveStory;
  el("copyBtn").onclick = async () => {
    const ok = await copyText(state.data.title + "\n\n" + assemble(state.data, state.values).plain);
    toast(ok ? "Copied" : "Copy blocked — select the story to copy");
    if (!ok) {
      const range = document.createRange(); range.selectNodeContents(el("storyText"));
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    }
  };
</script>
</body>
</html>
